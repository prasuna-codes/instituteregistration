<!DOCTYPE html>
<html>
<head>
    <title>Training Institute Webpage</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* Header Frame */
        .header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 28px;
        }

        /* Layout */
        .container {
            display: flex;
            height: calc(100vh - 80px);
        }

        /* Navigation Frame */
        .nav {
            width: 20%;
            background-color: #34495e;
            padding: 20px;
        }

        .nav a {
            display: block;
            text-decoration: none;
            color: white;
            background-color: #3d566e;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .nav a:hover {
            background-color: #1abc9c;
        }

        /* Main Frame */
        .main {
            width: 80%;
            padding: 20px;
            overflow-y: auto;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #1abc9c;
            color: white;
        }

        /* Form Styling */
        form {
            width: 60%;
            background: #f4f4f4;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background-color: #1abc9c;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #16a085;
        }

    </style>
</head>

<body>

    <!-- Header Frame -->
    <div class="header">
        ABC Training Institute
    </div>

    <!-- Container -->
    <div class="container">

        <!-- Navigation Frame -->
        <div class="nav">
            <a href="#courses">Courses</a>
            <a href="#form">Course Selection</a>
        </div>

        <!-- Main Frame -->
        <div class="main">

            <!-- Courses Table -->
            <h2 id="courses">Training Courses</h2>

            <table>
                <tr>
                    <th rowspan="2">Course</th>
                    <th colspan="2">Details</th>
                </tr>
                <tr>
                    <th>Duration</th>
                    <th>Fees</th>
                </tr>

                <tr>
                    <td>Web Development</td>
                    <td>3 Months</td>
                    <td>₹15,000</td>
                </tr>

                <tr>
                    <td>Python Programming</td>
                    <td>4 Months</td>
                    <td>₹18,000</td>
                </tr>

                <tr>
                    <td>Data Science</td>
                    <td>6 Months</td>
                    <td>₹30,000</td>
                </tr>
            </table>

            <!-- Course Selection Form -->
            <h2 id="form">Course Selection Form</h2>

            <form>
                <label>Name:</label>
                <input type="text" required>

                <label>Email:</label>
                <input type="email" required>

                <label>Select Course:</label>
                <select>
                    <option>Web Development</option>
                    <option>Python Programming</option>
                    <option>Data Science</option>
                </select>

                <label>Duration Preference:</label>
                <select>
                    <option>1-3 Months</option>
                    <option>3-6 Months</option>
                </select>

                <button type="submit">Submit</button>
            </form>

        </div>
    </div>

</body>
</html>
